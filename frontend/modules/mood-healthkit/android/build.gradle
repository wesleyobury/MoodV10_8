// Android build for the mood-healthkit local Expo module.
//
// Android counterpart to the iOS MoodHealthKit target, backed by Health
// Connect instead of HealthKit. Autolinked from source by Expo Modules
// (lives under frontend/modules), so no `publication` block is needed.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.official.moodapp'
version = '1.0.0'

android {
  namespace 'expo.modules.moodhealthkit'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Health Connect client — first stable release (1.1.0 shipped with no API
  // changes from the 1.1.0-rc line this module was written against).
  implementation 'androidx.health.connect:connect-client:1.1.0'
  // Kotlin coroutines are provided transitively by expo-modules-core / RN;
  // we intentionally do NOT pin a version here so Gradle resolves the one the
  // rest of the app uses (matches the mood-storekit module).
}
