// Android build for the mood-storekit local Expo module.
//
// Mirrors the iOS MoodStoreKit target but backed by Google Play Billing
// instead of StoreKit 2. Autolinked from source by Expo Modules (this dir
// lives under frontend/modules), so no `publication` block is needed —
// unlike published npm modules such as expo-haptics.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.official.moodapp'
version = '1.0.0'

android {
  namespace 'expo.modules.moodstorekit'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Google Play Billing Library — current stable, comfortably above Google's
  // 8.x+ floor (Aug 31 2026). We use the PLAIN `billing` (Java) artifact, NOT
  // `billing-ktx`: the ktx add-on is compiled with a newer Kotlin than Expo
  // SDK 54 / RN 0.81 (Kotlin 2.1), which fails with an "incompatible Kotlin
  // metadata" error. The Java artifact has no Kotlin metadata, so it always
  // links; this module wraps Billing's callbacks in coroutines itself.
  implementation 'com.android.billingclient:billing:9.1.0'
}
